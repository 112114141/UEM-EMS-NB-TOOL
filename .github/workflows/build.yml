name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: NB-TOOL.exe
          - os: macos-latest
            artifact: NB-TOOL-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests PyYAML pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name "NB-TOOL" main.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name "NB-TOOL-mac" main.py
          cd dist && zip -r NB-TOOL-mac.zip NB-TOOL-mac.app
      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/${{ matrix.artifact }}
          tag: ${{ github.ref_name }}
          overwrite: true